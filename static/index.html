<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>void crate</title>
<link rel="icon" href="/favicon.svg">
<meta name="theme-color" content="#f2f2f2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Instrument+Serif&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css?v=nodate1">
</head>
<body>
<div class="grain" aria-hidden="true"></div>
<div class="marks" aria-hidden="true"><i></i><i></i><i></i><i></i></div>

<header class="nav-wrap">
  <nav class="nav" aria-label="Main">
    <a class="brand" href="#/" aria-label="void crate, home" id="brand-word">void crate</a>
    <div class="nav-links">
      <a href="#/albums" data-nav="albums">Records</a>
      <a href="#/songs" data-nav="songs">Tracks</a>
    </div>
    <label class="nav-search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>
      <input id="q" type="search" placeholder="Search" autocomplete="off" aria-label="Search artists, records and tracks">
    </label>
    <div class="nav-tools">
      <button class="txt-btn" id="rescan" title="Refresh the crate">Refresh</button>
      <form method="post" action="/logout"><button class="txt-btn">Leave</button></form>
      <button class="burger" id="burger" aria-label="Open menu" aria-expanded="false" aria-controls="menu">Menu</button>
    </div>
  </nav>
</header>

<div class="menu" id="menu" hidden>
  <a href="#/">Crate</a>
  <a href="#/albums">Records</a>
  <a href="#/songs">Tracks</a>
  <button type="button" data-action="rescan">Refresh</button>
  <form method="post" action="/logout"><button type="submit">Leave</button></form>
</div>

<main id="view" tabindex="-1"></main>

<footer class="player" id="player" hidden>
  <div class="player-core">
    <div class="pl-progress" aria-hidden="true"><i id="pl-bar"></i></div>
    <a class="pl-now" id="np-link" href="#/">
      <span id="np-art"></span>
      <span class="pl-text"><strong id="np-title"></strong><small id="np-artist"></small></span>
    </a>
    <div class="pl-center">
      <div class="pl-buttons">
        <button class="pl-btn pl-mode" id="shuffle-btn" aria-label="Shuffle" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M4 7.5h3.2c4.3 0 5.3 9 9.6 9H20M4 16.5h3.2c1.5 0 2.6-1.1 3.5-2.6m2.6-3.8c.9-1.5 2-2.6 3.5-2.6H20M17.6 5.2 20 7.5l-2.4 2.3M17.6 14.2l2.4 2.3-2.4 2.3"/></svg></button>
        <button class="pl-btn" id="prev" aria-label="Previous (P)" title="Previous (P)"><svg viewBox="0 0 24 24"><path d="M7 5.5v13M18.5 6 9.5 12l9 6z"/></svg></button>
        <button class="pl-play" id="toggle" aria-label="Play" title="Play / pause (Space)"><svg viewBox="0 0 24 24" id="toggle-icon"><path d="M8.5 5.8v12.4L18.5 12z"/></svg></button>
        <button class="pl-btn" id="next" aria-label="Next (N)" title="Next (N)"><svg viewBox="0 0 24 24"><path d="M17 5.5v13M5.5 6l9 6-9 6z"/></svg></button>
        <button class="pl-btn pl-mode" id="repeat-btn" aria-label="Repeat off" data-mode="off"><svg viewBox="0 0 24 24"><path d="M5 11.5V10a3 3 0 0 1 3-3h11M16.6 4.6 19 7l-2.4 2.4M19 12.5V14a3 3 0 0 1-3 3H5m2.4 2.4L5 17l2.4-2.4"/></svg></button>
        <button class="pl-btn" id="queue-btn" aria-label="Queue (Q)" title="Queue (Q)" aria-controls="queue"><svg viewBox="0 0 24 24"><path d="M4 6.5h13M4 11.5h13M4 16.5h8M16.5 14v6.5M19.5 17.2l-3 3.3-3-3.3"/></svg></button>
      </div>
      <div class="pl-seek">
        <span id="t-cur">0:00</span>
        <input id="seek" type="range" min="0" max="1000" value="0" aria-label="Seek">
        <span id="t-dur">0:00</span>
      </div>
    </div>
    <div class="pl-extra">
      <span class="chip" id="np-quality"></span>
      <input id="vol" type="range" min="0" max="1" step="0.01" value="1" aria-label="Volume">
      <a class="txt-btn" id="np-download" title="Download this track">Download</a>
    </div>
  </div>
</footer>

<aside class="queue" id="queue" hidden aria-label="Queue">
  <div class="q-head"><span class="lbl">Queue</span><span class="q-tools"><button class="lbl" id="q-clear">Clear up next</button><button class="lbl" id="q-close">Close</button></span></div>
  <div class="q-list" id="q-list"></div>
  <div class="q-keys lbl mute">Space play · N next · P previous · Shift ←/→ 10 s · S shuffle · R repeat · M mute · / search</div>
</aside>
<div class="peek" id="peek" aria-hidden="true"></div>
<audio id="audio" preload="metadata"></audio>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="/static/app.js?v=nodate1"></script>
</body>
</html>
