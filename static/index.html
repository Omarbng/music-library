<!doctype html>
<html lang="en">
<head>

<title>void crate</title>
<link rel="icon" href="/favicon.svg">
<meta name="theme-color" content="#000000">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Manrope:wght@300;400;500;600;700&family=Tilt+Warp&display=swap" rel="stylesheet">

</head>
<body>
<canvas id="stars" aria-hidden="true"></canvas>
<div class="grain" aria-hidden="true"></div>

<header class="nav-wrap">
  <nav class="nav" aria-label="Main">

    <div class="nav-links">
      <a href="#/" data-nav="home">Crate</a>
      <a href="#/albums" data-nav="albums">Records</a>
      <a href="#/songs" data-nav="songs">Tracks</a>
    </div>
    <label class="nav-search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>
      <input id="q" type="search" placeholder="Search the crate" autocomplete="off" aria-label="Search artists, records and tracks">
      <kbd>/</kbd>
    </label>
    <div class="nav-tools">
      <button class="ghost-btn" id="rescan" title="Refresh library" aria-label="Refresh library">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.5 12a7.5 7.5 0 0 1-13 5.1M4.5 12a7.5 7.5 0 0 1 13-5.1"/><path d="M17.5 3.5v3.6h-3.6M6.5 20.5v-3.6h3.6"/></svg>
      </button>
      <form method="post" action="/logout" class="nav-logout">
        <button class="ghost-btn" title="Sign out" aria-label="Sign out">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 4.5h4a1.5 1.5 0 0 1 1.5 1.5v12a1.5 1.5 0 0 1-1.5 1.5h-4"/><path d="M10 8 6 12l4 4M6 12h9.5"/></svg>

      </form>
      <button class="burger" id="burger" aria-label="Open menu" aria-expanded="false" aria-controls="menu"><span></span><span></span></button>
    </div>
  </nav>
</header>

<div class="menu" id="menu" hidden>
  <a href="#/">Crate</a>
  <a href="#/albums">Records</a>
  <a href="#/songs">Tracks</a>
  <button type="button" data-action="rescan">Refresh library</button>
  <form method="post" action="/logout"><button type="submit">Sign out</button></form>
</div>

<main id="view" tabindex="-1"></main>

<footer class="player" id="player" hidden>
  <div class="player-core">
    <div class="pl-progress" aria-hidden="true"><i id="pl-bar"></i></div>
    <a class="pl-now" id="np-link" href="#/">
      <span id="np-art"></span>
      <span class="pl-text"><strong id="np-title"></strong><small id="np-artist"></small></span>
    </a>
    <div class="pl-center">
      <div class="pl-buttons">
        <button class="pl-btn" id="prev" aria-label="Previous"><svg viewBox="0 0 24 24"><path d="M7 5.5v13M18.5 6 9.5 12l9 6z"/></svg></button>
        <button class="pl-play" id="toggle" aria-label="Play"><svg viewBox="0 0 24 24" id="toggle-icon"><path d="M8.5 5.8v12.4L18.5 12z"/></svg></button>
        <button class="pl-btn" id="next" aria-label="Next"><svg viewBox="0 0 24 24"><path d="M17 5.5v13M5.5 6l9 6-9 6z"/></svg></button>
      </div>
      <div class="pl-seek">
        <span id="t-cur">0:00</span>
        <input id="seek" type="range" min="0" max="1000" value="0" aria-label="Seek">
        <span id="t-dur">0:00</span>
      </div>
    </div>
    <div class="pl-extra">
      <span class="chip" id="np-quality"></span>
      <input id="vol" type="range" min="0" max="1" step="0.01" value="1" aria-label="Volume">
      <a class="ghost-btn" id="np-download" title="Download this song" aria-label="Download this song"><svg viewBox="0 0 24 24"><path d="M12 4v11M7.5 11 12 15.5 16.5 11M5 19.5h14"/></svg></a>
    </div>
  </div>
</footer>

<audio id="audio" preload="metadata"></audio>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="/static/app.js?v=crate2"></script>
</body>
</html>
