<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>void crate · sign in</title>
<link rel="icon" href="/favicon.svg">
<meta name="theme-color" content="#000000">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600&family=Tilt+Warp&display=swap" rel="stylesheet">
<style>
  :root { --muted:#9aa1ad; --faint:#5c6370; --line:rgba(255,255,255,.08); --accent:#f3efe6; --spring:cubic-bezier(.32,.72,0,1); --out:cubic-bezier(.22,1,.36,1); color-scheme:dark; }
  * { box-sizing:border-box; }
  html,body { margin:0; }
  body { min-height:100dvh; display:grid; place-items:center; padding:24px 16px; background:#000; color:#fff; font:400 15px/1.55 "Manrope",ui-sans-serif,system-ui,sans-serif; -webkit-font-smoothing:antialiased; overflow:hidden; }
  canvas { position:fixed; inset:0; width:100%; height:100%; pointer-events:none; }
  .glow { position:fixed; left:50%; top:55%; width:720px; height:720px; margin:-360px 0 0 -360px; border-radius:50%; background:radial-gradient(closest-side, rgba(255,255,255,.07), transparent 70%); pointer-events:none; }
  .wrap { position:relative; width:100%; max-width:420px; text-align:center; animation:rise 1.1s var(--out) both; }
  @keyframes rise { from { opacity:0; transform:translateY(40px); filter:blur(10px); } to { opacity:1; transform:none; filter:none; } }
  .mark { display:inline-grid; grid-template-columns:repeat(2,9px); gap:4px; transform:rotate(45deg); margin-bottom:30px; }
  .mark i { width:9px; height:9px; border-radius:3px; background:#fff; }
  .eyebrow { display:inline-flex; align-items:center; gap:8px; padding:6px 12px; border-radius:999px; font:600 10.5px/1 "Manrope",sans-serif; letter-spacing:.2em; text-transform:uppercase; color:var(--muted); background:rgba(255,255,255,.04); box-shadow:inset 0 0 0 1px var(--line); }
  .eyebrow b { width:5px; height:5px; border-radius:50%; background:#f3efe6; opacity:.8; }
  h1 { margin:18px 0 10px; font:400 clamp(44px,11vw,64px)/.98 "Tilt Warp","Arial Rounded MT Bold",sans-serif; letter-spacing:-.035em; }
  p { margin:0 0 30px; color:var(--muted); }
  .bezel { padding:6px; border-radius:28px; background:rgba(255,255,255,.035); box-shadow:inset 0 0 0 1px var(--line); text-align:left; }
  .core { padding:22px; border-radius:22px; background:#0c0c0f; box-shadow:inset 0 1px 0 rgba(255,255,255,.06); }
  label { display:block; font-size:13px; color:var(--muted); margin:0 0 8px 4px; }
  input { width:100%; height:52px; padding:0 18px; border:0; border-radius:16px; background:rgba(255,255,255,.05); box-shadow:inset 0 0 0 1px var(--line); color:#fff; font:500 16px "Manrope",sans-serif; outline:none; transition:box-shadow .4s var(--spring); }
  input:focus { box-shadow:inset 0 0 0 1px rgba(255,255,255,.3); }
  button { margin-top:14px; width:100%; height:54px; display:flex; align-items:center; justify-content:space-between; padding:0 22px; border:0; border-radius:999px; background:var(--accent); color:#0b0b0c; font:600 15px "Manrope",sans-serif; cursor:pointer; transition:transform .6s var(--spring), background .4s var(--spring); }
  button:hover { background:#fff; }
  button:active { transform:scale(.98); }
  .ico { display:grid; place-items:center; opacity:.75; transition:transform .6s var(--spring); }
  button:hover .ico { transform:translateX(2px); }
  svg { width:17px; height:17px; fill:none; stroke:currentColor; stroke-width:1.5; stroke-linecap:round; stroke-linejoin:round; }
  .err { min-height:20px; margin:14px 4px 0; color:#ff8c7a; font-size:13px; text-align:center; }
  @media (prefers-reduced-motion: reduce) { .wrap { animation:none; } }
</style>
</head>
<body>
<canvas id="stars" aria-hidden="true"></canvas>
<div class="glow" aria-hidden="true"></div>
<main class="wrap">
  <span class="mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span><br>
  <span class="eyebrow"><b></b>void crate · private</span>
  <h1>Enter the void.</h1>
  <p>A private crate of selected, raw music.<br>Sign in to listen.</p>
  <form class="bezel" method="post" action="/login">
    <div class="core">
      <label for="pw">Password</label>
      <input id="pw" name="password" type="password" autocomplete="current-password" autofocus required>
      <button type="submit">Sign in <span class="ico"><svg viewBox="0 0 24 24"><path d="M7 17 17 7M9 7h8v8"/></svg></span></button>
      <div class="err" id="err"></div>
    </div>
  </form>
</main>
<script>
  const e = new URLSearchParams(location.search).get("error");
  if (e) document.getElementById("err").textContent = e === "wait" ? "Too many attempts. Wait five minutes and try again." : "That password didn't match.";
  (function () {
    const c = document.getElementById("stars"), x = c.getContext("2d"), still = matchMedia("(prefers-reduced-motion: reduce)").matches;
    let w, h, s = [];
    function size() { const d = Math.min(devicePixelRatio || 1, 2); w = innerWidth; h = innerHeight; c.width = w * d; c.height = h * d; x.setTransform(d, 0, 0, d, 0, 0);
      s = Array.from({ length: Math.round(w * h / 5200) }, () => ({ x: Math.random() * w, y: Math.random() * h, z: Math.random() ** 2, p: Math.random() * 6.28 })); }
    function draw(t) { x.clearRect(0, 0, w, h);
      for (const o of s) { x.globalAlpha = (.18 + o.z * .7) * (still ? .8 : .55 + .45 * Math.sin(t * .0015 + o.p)); x.fillStyle = "#fff"; x.beginPath(); x.arc(o.x, o.y, .35 + o.z * 1.25, 0, 6.283); x.fill(); if (!still) o.y = (o.y + .015 + o.z * .03) % h; }
      if (!still) requestAnimationFrame(draw); }
    addEventListener("resize", size); size(); requestAnimationFrame(draw);
  })();
</script>
</body>
</html>
